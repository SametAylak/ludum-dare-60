<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beigebox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen stage. Dark lab wall, phosphor CRT as the backdrop, seven parts on a walnut desk, beige keyboard deck as the parts palette. */
:root{
  --wall:#1a1f23; --wall-2:#232a2f;
  --desk:#5a4534; --desk-hi:#7b5f46; --desk-edge:#9a7a5b;
  --deck:#d3c8aa; --deck-lo:#b3a786; --deck-ink:#5d5440;
  --beige:#dcd2b6; --beige-hi:#efe7cf; --beige-lo:#b9ad8d; --ink:#26221d;
  --metal:#a3a9b0; --metal-hi:#c9ced4;
  --screen:#06170e; --phos:#5cf58e; --amber:#ffb12b; --red:#ff4b3a;
  --text:#ebe5d4; --muted:#8f9c9f;
  --c-beat:#3aa5bf; --c-fx:#9bbf35; --c-mel:#ee8530; --c-voc:#d4568b;
  --f-display:"Silkscreen", "Courier New", monospace;
  --f-screen:"VT323", "Courier New", monospace;
  --f-ui:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--text);font-family:var(--f-ui);font-size:14px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--phos);outline-offset:3px}

.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;
  background:
    radial-gradient(ellipse 70% 55% at 50% 32%, rgba(92,245,142,.07), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 139px, rgba(255,255,255,.022) 139px 141px),
    linear-gradient(var(--wall-2), var(--wall));}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;
  padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.badge{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.logo{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--beige);line-height:1}
.logo b{color:var(--phos);font-weight:700}
.model{font-family:var(--f-display);font-size:10px;color:var(--muted);letter-spacing:.14em}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--ink);
  background:linear-gradient(var(--beige-hi), var(--beige));border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;
  padding:6px 11px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn .led{width:8px;height:8px;border-radius:50%;background:#4a3f33;border:1px solid var(--ink)}
.btn.on .led{background:var(--phos);box-shadow:0 0 8px var(--phos)}
#turbo.on .led{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.readout{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:9px;letter-spacing:.12em;color:var(--muted)}
.seg{font-family:var(--f-screen);font-size:26px;line-height:1;color:var(--red);background:#170807;border:2px solid #000;border-radius:4px;
  padding:1px 7px;text-shadow:0 0 6px rgba(255,75,58,.75);min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:3px}
.bars i{width:14px;height:9px;background:#2c3337;border:1px solid #000;border-radius:2px}
.bars i.on{background:var(--phos);box-shadow:0 0 6px var(--phos)}

/* ---------- stage ---------- */
.stage{--meta:62px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;padding-top:clamp(6px, 3vh, 40px);overflow:hidden}
.floor{position:relative;z-index:2}
.floor::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 12px - var(--meta));height:100vh;z-index:0;
  border-top:2px solid var(--desk-edge);background:linear-gradient(var(--desk-hi), var(--desk) 10px)}
.crt{position:relative;z-index:1;flex:1 1 0;min-height:160px;max-height:min(820px, 58vh);
  width:min(calc(100% - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px))), max(980px, 64vw));margin-inline:auto;
  background:linear-gradient(#3b4045,#2a2e32);border:3px solid #0d0e0f;border-radius:26px 26px 12px 12px;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.08)}
.crt::after{content:"BEIGEBOX VGA";position:absolute;left:22px;bottom:8px;font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:#7b8288}
.crt::before{content:"";position:absolute;right:24px;bottom:11px;width:7px;height:7px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px var(--phos)}
.glass{position:absolute;inset:14px 16px 28px;border-radius:18px/26px;border:3px solid #050505;overflow:hidden;background:var(--screen)}
#scope{position:absolute;inset:0;width:100%;height:100%;display:block}
#term{position:absolute;inset:0;margin:0;padding:12px 18px;font-family:var(--f-screen);font-size:clamp(15px, 1.5vw, 30px);line-height:1.12;
  color:var(--phos);text-shadow:0 0 6px rgba(92,245,142,.55);white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere}
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
             radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}

.shelf{position:relative;z-index:2;display:grid;grid-template-columns:repeat(7, minmax(0,1fr));width:min(100%, max(1120px, 72vw));margin:-44px auto 0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.slot{display:flex;flex-direction:column;min-width:0;--cat:transparent}
.char{position:relative;aspect-ratio:120/130;max-width:100%;margin-inline:clamp(2px, .8vw, 10px);cursor:pointer;border-radius:12px}
.slot:not(.has) .char{cursor:default}
.art-wrap,.art-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.drop{position:absolute;inset:22% 8% 0;border:2px dashed rgba(235,229,212,.2);border-bottom:none;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  font-family:var(--f-display);font-size:10px;letter-spacing:.1em;color:rgba(235,229,212,.36);transition:background .15s, border-color .15s}
.drop small{font-size:8px;opacity:.8}
.slot.has .drop{display:none}
.slot.hover .drop{border-color:var(--phos);color:var(--phos);background:rgba(92,245,142,.07)}
.slot.hover.has .art{filter:drop-shadow(0 0 10px var(--phos))}
.boot{position:absolute;left:14%;right:14%;bottom:10px;display:none;text-align:center;font-family:var(--f-screen);font-size:16px;color:var(--phos);text-shadow:0 0 6px rgba(92,245,142,.7)}
.boot i{display:block;height:7px;margin-top:2px;border:1px solid var(--phos);background:linear-gradient(90deg, var(--phos) var(--p, 0%), rgba(0,0,0,.5) 0)}
.slot.wait .boot{display:block}
.plank{height:12px;border-top:2px solid var(--desk-edge);background:linear-gradient(var(--desk-hi), var(--desk))}
.meta{height:var(--meta);background:var(--desk);display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 4px 0;min-width:0}
.tag{display:flex;align-items:center;gap:5px;max-width:100%;font-family:var(--f-display);font-size:10px;letter-spacing:.05em;color:var(--ink);
  background:var(--beige-hi);border:2px solid var(--ink);border-radius:3px;padding:1px 6px;white-space:nowrap;overflow:hidden}
.tag::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--cat);border:1px solid var(--ink)}
.tag span{overflow:hidden;text-overflow:ellipsis}
.slot:not(.has) .tag{visibility:hidden}
.slot.muted .tag,.slot.dim .tag{opacity:.55}
.tools{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.slot.has:hover .tools,.slot.has:focus-within .tools{opacity:1}
@media (hover:none){.slot.has .tools{opacity:1}}
.slot:not(.has) .tools{visibility:hidden}
.tools button{font-family:var(--f-display);font-size:9px;letter-spacing:.04em;padding:3px 5px;background:#2f241b;color:var(--beige);border:1px solid #1c140e;border-radius:3px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.tools button:hover{background:#45362a}
.tools button[aria-pressed="true"]:hover{background:#ffc35a}

/* ---------- parts art ---------- */
.art{display:block;overflow:visible}
.art :is(rect,circle,ellipse,path){stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.art :is(.ns,.ep,.es,.lit,.ph,.glow,.lp,.hole,.shadow,.flash){stroke:none}
.art .shadow{fill:rgba(0,0,0,.35)}
.art .b{fill:var(--beige)} .art .bl{fill:var(--beige-hi)} .art .bd{fill:var(--beige-lo)}
.art .m{fill:var(--metal)} .art .mh{fill:var(--metal-hi)} .art .k{fill:#2b2a29} .art .k2{fill:#4b4946} .art .w{fill:#f7f4ea}
.art .scr{fill:var(--screen)} .art .ph{fill:var(--phos)} .art .g{fill:#2e7a4b} .art .au{fill:#e3b23c} .art .blu{fill:#3a62b5} .art .r{fill:#d33b2e}
.art .tt{fill:#c8c299} .art .ibm{fill:#7f94a7} .art .cg{fill:#9d9da2} .art .lab{fill:var(--c-mel)} .art .osc{fill:#8fa4ae}
.art .tan{fill:#c9a878} .art .tan2{fill:#b38e5c} .art .glass{fill:rgba(190,225,255,.14)} .art .scr2{fill:#1c1a18}
.art .hole{fill:#c8c1b0} .art .hi{fill:rgba(255,255,255,.55);stroke:none}
.art .ew{fill:#fff} .art .ep{fill:var(--ink)} .art .es{fill:#fff}
.art .mouth{fill:#5a2424}
.art .mouth.ph{fill:var(--phos)}
.art .mouth.slotm{fill:#1d1b19}
.art .flash{fill:var(--phos);opacity:0}
.art .wave{fill:none;stroke:var(--phos);stroke-width:2.5}
.art .ledb{fill:#3b3631}
.art .lit{fill:var(--amber);color:var(--amber);opacity:0;filter:drop-shadow(0 0 3px currentColor)}
.art .lit.lg{fill:var(--phos);color:var(--phos)} .art .lit.lr{fill:var(--red);color:var(--red)}
.art :is(.hl,.ln,.grill,.trace,.ridge,.tape,.cord,.wire,.wire2,.pin,.getter,.wireg,.grid,.kt,.handle){fill:none}
.art .hl{stroke:rgba(255,255,255,.75);stroke-width:3}
.art .ln{stroke:#9a958a;stroke-width:2}
.art .grill{stroke:var(--metal);stroke-width:2.5}
.art .trace{stroke:#5fb27c;stroke-width:2}
.art .ridge{stroke:#6e6e72;stroke-width:2}
.art .tape{stroke:#5b3a22;stroke-width:2}
.art .cord{stroke:var(--ink);stroke-width:3}
.art .wire{stroke:#c8392c;stroke-width:3}
.art .wire2{stroke:#1a1a1a;stroke-width:3}
.art .pin{stroke:#8a9097;stroke-width:3}
.art .getter{stroke:#b9c3cc;stroke-width:3}
.art .wireg{stroke:#8a9097;stroke-width:2}
.art .grid{stroke:rgba(92,245,142,.18);stroke-width:1}
.art .kt{stroke:var(--beige);stroke-width:2}
.art .handle{stroke:var(--ink);stroke-width:5}
.art text{stroke:none}
.art .chip-t{font-family:var(--f-display);font-size:9px;fill:#a3a097;text-anchor:middle}
.art .seg-t{font-family:var(--f-screen);font-size:13px;fill:var(--red);text-anchor:middle}
.art .ct{font-family:var(--f-display);font-size:7px;fill:var(--ink);text-anchor:middle}
.art .glow{fill:#ff9a3c;opacity:.15;filter:blur(3px)}
.art .lp{fill:#3a3530}

.art .bump{transform-box:fill-box;transform-origin:50% 100%}
.art :is(.eyes,.mouth,.cap,.cone,.disk,.paper,.btnL,.btnR){transform-box:fill-box;transform-origin:50% 50%}
.art :is(.spin,.stick,.arm){transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flicker{0%,100%{opacity:.55}40%{opacity:.72}43%{opacity:.38}60%{opacity:.62}}
@keyframes lp{0%{fill:var(--c)}50%{fill:#3a3530}}
.slot .art .eyes{animation:blink 5s infinite var(--bd, 0s)}
.slot.on .art .spin{animation:spin 1.1s linear infinite}
.slot.on .art .lit.steady{opacity:1}
.slot.on .art .glow{opacity:.55;animation:flicker 2.3s infinite}
.slot.on .art .lp{animation:lp var(--t, 1s) steps(1) infinite var(--d, 0s)}
.slot.wait .art{opacity:.5;filter:grayscale(.7)}
.slot.muted .art,.slot.dim .art{filter:grayscale(.9) brightness(.62)}
.slot.muted .art .eyes,.slot.dim .art .eyes{animation:none;transform:scaleY(.12)}
.slot.solo .char{box-shadow:0 0 0 2px var(--amber), 0 0 22px rgba(255,177,43,.35)}

/* ---------- keyboard deck (palette) ---------- */
.deck{--kw:clamp(50px, calc((100vw - 236px) / 20), 96px);position:relative;z-index:3;
  background:linear-gradient(var(--deck), var(--deck-lo));border-top:3px solid var(--ink);box-shadow:0 -8px 24px rgba(0,0,0,.35);
  padding-block:12px 18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px}
.group{display:flex;flex-direction:column;gap:7px}
.group h2{margin:0;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:400;font-size:10px;letter-spacing:.18em;color:var(--deck-ink)}
.group h2::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cat);border:1px solid var(--ink)}
.keys{display:flex;gap:6px}
.key{position:relative;width:var(--kw);aspect-ratio:1/1.06;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--cat);border:2px solid var(--ink);border-radius:8px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 var(--ink);
  transition:transform .08s, box-shadow .08s, filter .15s}
.key:hover{filter:brightness(1.07)}
.key .face{position:absolute;inset:4px 5px 9px;border-radius:6px;background:linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.06))}
.key svg{position:absolute;left:18%;top:15%;width:64%;height:auto}
.key .lg{position:absolute;top:4px;left:7px;font-family:var(--f-display);font-size:10px;color:var(--ink);line-height:1}
.key .nm{position:absolute;left:2px;right:2px;bottom:9px;font-family:var(--f-display);font-size:7.5px;letter-spacing:.02em;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;line-height:1}
.key .kled{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.3)}
.key.used{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 0 var(--ink)}
.key.used .kled{background:var(--phos);box-shadow:0 0 6px var(--phos)}
.ghost{position:fixed;z-index:50;pointer-events:none;width:96px;transform:translate(-50%, -70%) rotate(-6deg);filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.ghost svg{width:100%;height:auto;display:block}

@media (max-width:1240px){ .deck{--kw:clamp(50px, calc((100vw - 150px) / 10), 70px)} }
@media (max-width:760px){
  .stage{--meta:58px}
  .shelf{grid-template-columns:repeat(8, minmax(0,1fr));margin-top:-26px}
  .slot{grid-column:span 2}
  .slot:nth-child(5){grid-column:2 / span 2}
  .crt{max-height:230px}
}
@media (max-width:640px){
  .deck{--kw:min(66px, calc((100vw - 64px) / 5))}
  .logo{font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  .slot .art .eyes,.slot.on .art .spin,.slot.on .art .glow,.slot.on .art .lp{animation:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="badge">
      <h1 class="logo">BEIGE<b>BOX</b></h1>
      <span class="model">486/DX2 · BEAT ASSEMBLER</span>
    </div>
    <div class="ctl">
      <button id="play" class="btn" type="button"><span class="led"></span><span class="lbl">PLAY</span></button>
      <button id="turbo" class="btn" type="button" aria-pressed="false"><span class="led"></span>TURBO</button>
      <div class="readout" aria-label="Tempo"><span class="seg" id="bpm">110</span>BPM</div>
      <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button id="shuffle" class="btn" type="button">SHUFFLE</button>
      <button id="clear" class="btn" type="button">CLEAR</button>
    </div>
  </header>

  <main class="stage">
    <div class="crt"><div class="glass"><canvas id="scope"></canvas><pre id="term" aria-live="off"></pre><div class="scan"></div></div></div>
    <div class="floor"><div class="shelf" id="shelf"></div></div>
  </main>

  <footer class="deck" id="deck" aria-label="Parts"></footer>
</div>

<script>
(() => {
"use strict";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);

/* ================= music ================= */
let BPM = 110, SPB = 60 / BPM / 4, turbo = false;
const LOOP = 64;
// Am - F - C - G, one chord per bar
const CHORDS = [
  { root: 45, n: [57, 60, 64] },
  { root: 41, n: [53, 57, 60] },
  { root: 48, n: [55, 60, 64] },
  { root: 43, n: [55, 59, 62] },
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* ================= synth ================= */
let ctx = null, master, analyser, delayIn, delay, fxBus;

function noiseBuf() {
  if (!ctx._nb) {
    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ctx._nb = b;
  }
  return ctx._nb;
}
function pulseWave(duty) {
  ctx._pw = ctx._pw || {};
  if (!ctx._pw[duty]) {
    const N = 40, re = new Float32Array(N), im = new Float32Array(N);
    for (let k = 1; k < N; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
    ctx._pw[duty] = ctx.createPeriodicWave(re, im);
  }
  return ctx._pw[duty];
}
function env(p, t, vol, a, hold, r) {
  p.setValueAtTime(0.0001, t);
  p.exponentialRampToValueAtTime(vol, t + a);
  if (hold > 0) p.setValueAtTime(vol, t + a + hold);
  const end = t + a + Math.max(0, hold) + r;
  p.exponentialRampToValueAtTime(0.0001, end);
  return end;
}
function tone(dest, t, o) {
  const { type = "sine", f, f2, glide = .05, vol = .3, a = .003, hold = 0, r = .15, wave, lp, q = .7, detune = 0, vib = 0, vibRate = 5.5 } = o;
  const osc = ctx.createOscillator();
  if (wave) osc.setPeriodicWave(wave); else osc.type = type;
  osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + glide);
  osc.detune.value = detune;
  const g = ctx.createGain();
  const end = env(g.gain, t, vol, a, hold, r);
  let node = osc;
  if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; fl.Q.value = q; osc.connect(fl); node = fl; }
  node.connect(g); g.connect(dest);
  if (vib) {
    const l = ctx.createOscillator(), lg = ctx.createGain();
    l.frequency.value = vibRate;
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime((f2 || f) * vib, t + Math.min(.35, end - t));
    l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(end + .05);
  }
  osc.start(t); osc.stop(end + .05);
  return end;
}
function noise(dest, t, o) {
  const { vol = .3, a = .002, hold = 0, r = .1, type = "bandpass", f = 2000, f2, Q = 1 } = o;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = Q;
  const g = ctx.createGain();
  const end = env(g.gain, t, vol, a, hold, r);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, end);
  s.connect(fl); fl.connect(g); g.connect(dest);
  s.start(t, Math.random() * 1.5); s.stop(end + .05);
  return end;
}
function fm(dest, t, o) {
  const { f, ratio = 1, index = 2, vol = .1, a = .004, hold = 0, r = .3 } = o;
  const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
  c.frequency.value = f; m.frequency.value = f * ratio;
  const end = env(g.gain, t, vol, a, hold, r);
  mg.gain.setValueAtTime(f * index, t);
  mg.gain.exponentialRampToValueAtTime(f * index * .15 + .01, end);
  m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(dest);
  c.start(t); m.start(t); c.stop(end + .05); m.stop(end + .05);
  return end;
}

const VOW = {
  a: [[800, 1], [1150, .5], [2900, .2]],
  o: [[450, 1], [800, .45], [2830, .12]],
  u: [[325, 1], [700, .3], [2530, .08]],
  e: [[400, 1], [1700, .4], [2600, .25]],
  i: [[300, 1], [2200, .35], [3000, .25]],
};
function voice(dest, t, o) {
  const { f, vowel = "a", vol = .3, a = .03, hold = .2, r = .12, scoop = .94, vib = .012, vibRate = 5.2 } = o;
  const osc = ctx.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(f * scoop, t);
  osc.frequency.exponentialRampToValueAtTime(f, t + .07);
  const g = ctx.createGain();
  const end = env(g.gain, t, vol, a, hold, r);
  const l = ctx.createOscillator(), lg = ctx.createGain();
  l.frequency.value = vibRate;
  lg.gain.setValueAtTime(0, t);
  lg.gain.linearRampToValueAtTime(f * vib, t + Math.max(.08, (end - t) * .6));
  l.connect(lg); lg.connect(osc.frequency);
  for (const [ff, amp] of VOW[vowel]) {
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = ff; bp.Q.value = ff / 90;

  }
  g.connect(dest);
  osc.start(t); l.start(t); osc.stop(end + .05); l.stop(end + .05);
  return end;
}

  if (delay) delay.delayTime.setTargetAtTime(SPB * 3, ctx.currentTime, .05);
  $("#bpm").textContent = BPM;
  turboBtn.classList.toggle("on", on);
  turboBtn.setAttribute("aria-pressed", on);
}

/* ================= slots ================= */
const shelf = $("#shelf");
slots.forEach(sl => {
  const el = document.createElement("div");
  el.className = "slot"; el.dataset.i = sl.i;
  el.innerHTML = `<div class="char" tabindex="0" role="button"><div class="drop"><span>SLOT ${sl.i + 1}</span><small>DROP A PART</small></div><div class="art-wrap"></div><div class="boot">BOOTING<i></i></div></div>
    <div class="plank"></div>
    <div class="meta"><div class="tag"><span></span></div><div class="tools"><button type="button" data-a="mute" aria-pressed="false">MUTE</button><button type="button" data-a="solo" aria-pressed="false">SOLO</button><button type="button" data-a="del" aria-label="Remove part">✕</button></div></div>`;
  shelf.appendChild(el);
  sl.el = el; sl.char = $(".char", el); sl.wrap = $(".art-wrap", el); sl.tag = $(".tag span", el); sl.bar = $(".boot i", el);
  sl.muteBtn = $('[data-a="mute"]', el); sl.soloBtn = $('[data-a="solo"]', el);
});

function renderSlot(sl, pop) {
  const p = sl.id && byId[sl.id];
  sl.el.classList.toggle("has", !!p);
  sl.el.style.setProperty("--cat", p ? CATS[p.cat].color : "transparent");
  sl.wrap.innerHTML = p ? artSvg(p) : "";
  sl.svg = p ? sl.wrap.firstElementChild : null;
  sl.tag.textContent = p ? p.name : "";
  sl.char.setAttribute("aria-label", p ? `${p.name}. Press to mute or unmute.` : `Empty slot ${sl.i + 1}`);
  if (pop && p && !reduce) sl.svg.animate([
    { transform: "translateY(-30px) scale(.7)", opacity: 0 },
    { transform: "translateY(4px) scale(1.04)", opacity: 1, offset: .7 },
    { transform: "none", opacity: 1 }], { duration: 380, easing: "cubic-bezier(.2,.8,.3,1.2)" });
}
function applyGains() {
  const anySolo = slots.some(s => s.id && s.solo);
  for (const sl of slots) {
    sl.audible = !!sl.id && !sl.muted && (!anySolo || sl.solo);
    if (sl.g) sl.g.gain.setTargetAtTime(sl.audible ? byId[sl.id].gain : 0, ctx.currentTime, .015);
    sl.el.classList.toggle("muted", !!sl.id && sl.muted);
    sl.el.classList.toggle("dim", !!sl.id && !sl.muted && anySolo && !sl.solo);
    sl.el.classList.toggle("solo", !!sl.id && sl.solo);
    sl.muteBtn.setAttribute("aria-pressed", sl.muted);
    sl.soloBtn.setAttribute("aria-pressed", sl.solo);
  }
}
function place(id, i) {
  ensureAudio();
  const prev = slots.find(s => s.id === id);
  if (prev) clearSlot(prev);
  const sl = slots[i];
  if (sl.id) clearSlot(sl);
  const others = slots.some(s => s.id);
  sl.id = id; sl.muted = sl.solo = false; sl.uid = ++uidN;
  if (!running) setRunning(true);
  if (!others) resetTransport();
  else sl.start = Math.ceil(step / 16) * 16;
  makeNodes(sl);
  renderSlot(sl, true);
  applyGains(); updateKeys();
}
function clearSlot(sl) {
  dropNodes(sl);
  sl.id = null; sl.muted = sl.solo = false; sl.uid = ++uidN;
  renderSlot(sl);
  applyGains(); updateKeys();
}
let notice = null;
function togglePart(id) {
  const on = slots.find(s => s.id === id);
  if (on) { clearSlot(on); return; }
  const free = FILL_ORDER.find(i => !slots[i].id);
  if (free === undefined) { notice = { text: "ALL 7 SLOTS ARE FULL. REMOVE A PART FIRST.", until: performance.now() + 2600 }; return; }
  place(id, free);
}
function shuffle() {
  const pick = (cat, k) => PARTS.filter(p => p.cat === cat).sort(() => Math.random() - .5).slice(0, k);
  const chosen = [...pick("beat", 2), ...pick("fx", 1), ...pick("mel", 2), ...pick("voc", 2)].sort(() => Math.random() - .5);
  slots.forEach(s => { if (s.id) clearSlot(s); });
  chosen.forEach((p, i) => place(p.id, i));
}

shelf.addEventListener("click", e => {
  const slEl = e.target.closest(".slot"); if (!slEl) return;
  const sl = slots[+slEl.dataset.i]; if (!sl.id) return;
  const b = e.target.closest("button[data-a]");
  if (b) {
    const a = b.dataset.a;
    if (a === "mute") sl.muted = !sl.muted;
    else if (a === "solo") sl.solo = !sl.solo;
    else if (a === "del") { clearSlot(sl); return; }
    applyGains(); return;
  }
  if (e.target.closest(".char")) { sl.muted = !sl.muted; applyGains(); }
});
shelf.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("char")) return;
  const sl = slots[+e.target.closest(".slot").dataset.i];
  if (sl.id) { sl.muted = !sl.muted; applyGains(); }
  e.stopPropagation();
});

/* ================= deck / palette ================= */
const deck = $("#deck");
for (const cat of Object.keys(CATS)) {
  const g = document.createElement("div");
  g.className = "group"; g.style.setProperty("--cat", CATS[cat].color);
  g.innerHTML = `<h2>${CATS[cat].label}</h2><div class="keys"></div>`;
  for (const p of PARTS.filter(p => p.cat === cat)) {
    const k = document.createElement("button");
    k.type = "button"; k.className = "key"; k.dataset.id = p.id;
    k.setAttribute("aria-label", `${p.name}, ${CATS[cat].label.toLowerCase()}. Key ${p.key}`);
    k.setAttribute("aria-pressed", "false");
    k.innerHTML = `<span class="face"></span>${artSvg(p, true)}<span class="lg">${p.key}</span><span class="kled"></span><span class="nm">${p.short}</span>`;
    $(".keys", g).appendChild(k);
  }
  deck.appendChild(g);
}
function updateKeys() {
  deck.querySelectorAll(".key").forEach(k => {
    const used = slots.some(s => s.id === k.dataset.id);
    k.classList.toggle("used", used);
    k.setAttribute("aria-pressed", used);
  });
}

let drag = null, hoverSlot = null;
const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); const s = el && el.closest(".slot"); return s ? slots[+s.dataset.i] : null; };
function setHover(sl) {
  if (hoverSlot === sl) return;
  if (hoverSlot) hoverSlot.el.classList.remove("hover");
  hoverSlot = sl;
  if (sl) sl.el.classList.add("hover");
}
function endDrag() {
  if (drag && drag.ghost) drag.ghost.remove();
  setHover(null); drag = null;
}
deck.addEventListener("pointerdown", e => {
  const key = e.target.closest(".key");
  if (!key || e.button > 0) return;
  e.preventDefault();
  drag = { id: key.dataset.id, x: e.clientX, y: e.clientY, moved: false, ghost: null, pid: e.pointerId };
  key.setPointerCapture(e.pointerId);
});
deck.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    drag.moved = true;
    drag.ghost = document.createElement("div");
    drag.ghost.className = "ghost";
    drag.ghost.innerHTML = artSvg(byId[drag.id], true);
    document.body.appendChild(drag.ghost);
  }
  if (drag.moved) {
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top = e.clientY + "px";
    setHover(slotAt(e.clientX, e.clientY));
  }
});
deck.addEventListener("pointerup", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  const target = d.moved ? slotAt(e.clientX, e.clientY) : null;
  endDrag();
  if (!d.moved) togglePart(d.id);
  else if (target) place(d.id, target.i);
});
deck.addEventListener("pointercancel", endDrag);
deck.addEventListener("click", e => {
  const key = e.target.closest(".key");
  if (key && e.detail === 0) togglePart(key.dataset.id);   // keyboard activation only; pointer handled above
});

/* ================= header ================= */
const playBtn = $("#play"), turboBtn = $("#turbo"), barEls = [...document.querySelectorAll("#bars i")];
playBtn.addEventListener("click", () => setRunning(!running));
turboBtn.addEventListener("click", () => setTurbo(!turbo));
$("#shuffle").addEventListener("click", shuffle);
$("#clear").addEventListener("click", () => slots.forEach(s => { if (s.id) clearSlot(s); }));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); setRunning(!running); return; }
  if (e.repeat) return;
  const p = PARTS.find(p => p.key === e.key.toUpperCase());
  if (p) togglePart(p.id);
});

/* ================= per-frame ================= */
const BUMP = [{ transform: "scale(1.05,.93)" }, { transform: "scale(1,1)" }];
function fire(ev) {
  const sl = slots[ev.i];
  if (sl.uid !== ev.uid || !sl.audible || !sl.svg) return;
  const p = byId[sl.id], svg = sl.svg, k = ev.kinds;
  if (!reduce && k.includes("bump")) svg.querySelector(".bump").animate(BUMP, { duration: 170, easing: "ease-out" });
  if (k.includes("led")) {
    const lits = svg.querySelectorAll(".lit:not(.steady)");
    if (lits.length) (p.ledRand ? [lits[Math.random() * lits.length | 0]] : lits)
      .forEach(l => l.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: "ease-in" }));
  }
  if (k.includes("mouth")) {
    const m = svg.querySelector(".mouth"), o = p.mo || 2.6;
    if (m) m.animate([{ transform: "scaleY(1)" }, { transform: `scaleY(${o})`, offset: .15 }, { transform: `scaleY(${o * .8})`, offset: .8 }, { transform: "scaleY(1)" }],
      { duration: Math.max(140, (ev.dur || .2) * 1000) });
  }
  if (!reduce && k.includes("alt") && p.alt) p.alt(svg);
}
function comboLive(c) {
  return c.parts.every(id => { const s = slots.find(x => x.id === id); return s && s.audible && curStep >= s.start; });
}
function onStep(n) {
  const bar = (n >> 4) & 3;
  barEls.forEach((b, i) => b.classList.toggle("on", i === bar));
  if (n % 16 !== 0) return;
  for (const c of COMBOS) {
    const live = comboLive(c);
    if (live && !liveCombos.has(c.id)) {
      liveCombos.add(c.id);
      scene = { c, at: performance.now() };
      pendingFanfare = true;
      if (!unlocked.has(c.id)) { unlocked.add(c.id); saveBonus(); }
    } else if (!live) liveCombos.delete(c.id);
  }
}
function updateSlotStates() {
  for (const sl of slots) {
    const wait = !!sl.id && running && curStep < sl.start;
    const on = !!sl.id && running && !wait && sl.audible;
    sl.el.classList.toggle("wait", wait);
    sl.el.classList.toggle("on", on);
    if (wait) sl.bar.style.setProperty("--p", Math.round(Math.max(0, Math.min(1, 1 - (sl.start - curStep) / 16)) * 100) + "%");
  }
}

const term = $("#term");
let termCache = "";
function updateTerm() {
  const now = performance.now(), cursor = Math.floor(now / 500) % 2 ? "_" : " ";
  let out;
  if (scene && running && now - scene.at < 15000 && liveCombos.has(scene.c.id)) {
    const full = scene.c.lines.join("\n");
    out = "C:\\> BONUS.EXE\n\n" + full.slice(0, Math.floor((now - scene.at) / 1000 * 40)) + cursor;
  } else {
    const n = slots.filter(s => s.id).length;
    const pos = curStep >= 0 ? curStep % 16 : -1;
    const bar = curStep >= 0 ? ((curStep >> 4) & 3) + 1 : 1;
    let hint;
    if (notice && now < notice.until) hint = notice.text;
    else if (!running) hint = n ? "PRESS PLAY OR SPACE TO START THE MIX" : "PRESS PLAY OR SPACE TO POWER ON";
    else if (n === 0) hint = "DRAG A PART ONTO A SLOT, OR PRESS ITS KEY";
    else if (slots.some(s => s.id && curStep < s.start)) hint = "BOOTING... NEW PARTS JOIN ON THE NEXT BAR";
    else if (n < 7) hint = "ADD PARTS. SOME TRIOS UNLOCK BONUS DISKS";
    else hint = "FULL BAND. CLICK A PART TO MUTE IT";
    out = [
      "BEIGEBOX SOUND SYSTEM v1.0",
      `C:\\> MIX.EXE /BPM:${BPM}${turbo ? " /TURBO" : ""}`,
      "",
      `BAR ${bar}/4 [${Array.from({ length: 16 }, (_, i) => i <= pos ? "#" : ".").join("")}]  PARTS ${n}/7`,
      `BONUS DISKS ${unlocked.size}/4: ${COMBOS.map(c => unlocked.has(c.id) ? c.name : "??????").join(" | ")}`,
      "",
      "> " + hint + cursor,
    ].join("\n");
  }
  if (out !== termCache) { termCache = out; term.textContent = out; }
}

const scope = $("#scope"), sg = scope.getContext("2d");
let scopeBuf = null;
function sizeScope() {
  const r = scope.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  scope.width = Math.max(1, Math.round(r.width * dpr)); scope.height = Math.max(1, Math.round(r.height * dpr));
}
new ResizeObserver(sizeScope).observe(scope);
function drawScope() {
  const w = scope.width, hgt = scope.height, dpr = Math.min(2, devicePixelRatio || 1);
  sg.fillStyle = "rgba(6,23,14,0.38)";
  sg.fillRect(0, 0, w, hgt);
  const y0 = hgt * .7, amp = hgt * .4;
  sg.lineWidth = 2 * dpr; sg.strokeStyle = "#5cf58e"; sg.shadowColor = "#5cf58e"; sg.shadowBlur = 10 * dpr;
  sg.beginPath();
  if (analyser && running) {
    if (!scopeBuf) scopeBuf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(scopeBuf);
    let st = 1;
    while (st < scopeBuf.length / 2 && !(scopeBuf[st - 1] < 0 && scopeBuf[st] >= 0)) st++;
    const N = scopeBuf.length / 2;
    for (let i = 0; i < N; i++) {
      const x = i / (N - 1) * w, y = y0 - scopeBuf[st + i] * amp;
      i ? sg.lineTo(x, y) : sg.moveTo(x, y);
    }
  } else { sg.moveTo(0, y0); sg.lineTo(w, y0); }
  sg.stroke();
  sg.shadowBlur = 0;
}

function frame() {
  requestAnimationFrame(frame);
  if (ctx && running) {
    const now = ctx.currentTime;
    while (sq.length && sq[0].t <= now) { const e = sq.shift(); if (e.n !== curStep) { curStep = e.n; onStep(e.n); } }
    for (let k = vq.length - 1; k >= 0; k--) if (vq[k].t <= now) fire(vq.splice(k, 1)[0]);
  }
  updateSlotStates();
  drawScope();
  updateTerm();
}

/* ================= boot ================= */
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ slots: slots.map(s => s.id ? { id: s.id, muted: s.muted, solo: s.solo } : null), turbo }));
function start(data) {
  const saved = data && data.slots;
  if (data && data.turbo) setTurbo(true);
  if (saved) saved.forEach((d, i) => { if (d && byId[d.id] && slots[i]) Object.assign(slots[i], { id: d.id, muted: !!d.muted, solo: !!d.solo, uid: ++uidN }); });
  else [["hdd", 3], ["dot", 2], ["floppy", 4]].forEach(([id, i]) => Object.assign(slots[i], { id, uid: ++uidN }));
  slots.forEach(s => renderSlot(s));
  applyGains(); updateKeys();
  requestAnimationFrame(frame);
}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
