<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beigebox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/bonus.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/overclock.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/responsive.css">

<div class="app">
  <header class="top">
    <h1 class="logo">beige<b>b</b><b>o</b><b>x</b></h1>
    <div class="ctl">
      <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="tempo" role="group" aria-label="Tempo">
        <button id="bpmDown" class="tb" type="button" aria-label="Slower" title="Slower ( - )"><svg viewBox="0 0 24 24"><path class="st" d="M5 12h14"/></svg></button>
        <input id="bpmIn" type="range" min="80" max="180" step="1" value="110" aria-label="BPM">
        <div class="readout"><svg class="ocb" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6.5 6 12.5a6 6 0 0 1-12 0c0-3 1.8-5.2 3-7 .2 2 1 3.2 2.2 3.4C11 8 11 5 12 2z"/></svg><span id="bpm">110</span>BPM</div>
        <button id="bpmUp" class="tb" type="button" aria-label="Faster" title="Faster ( = )"><svg viewBox="0 0 24 24"><path class="st" d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="vol" role="group" aria-label="Master volume">
        <button id="muteAll" class="tb" type="button" aria-pressed="false" aria-label="Mute everything" title="Mute everything ( M )"><svg class="i-on" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="st" d="M16 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><svg class="i-off" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="st" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <input id="volIn" class="rng" type="range" min="0" max="100" step="1" value="80" aria-label="Master volume">
      </div>
      <button id="shuffle" class="rb" type="button" aria-label="Shuffle" title="Shuffle"><svg viewBox="0 0 24 24"><path class="st" d="M3 7h3c5 0 7 10 12 10h2M3 17h3c2 0 3-1.4 4.4-3.4M13.6 10.4C15 8.4 16 7 18 7h2"/><path d="m19 3.5 3.5 3.5L19 10.5zM19 13.5l3.5 3.5-3.5 3.5z"/></svg></button>
      <button id="clear" class="rb" type="button" aria-label="Clear all parts" title="Clear"><svg viewBox="0 0 24 24"><path class="st" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M3 3v7h7z"/></svg></button>
      <button id="play" class="rb big" type="button" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <div class="lights" aria-hidden="true"><i></i><i></i></div>
    <canvas id="scope" aria-hidden="true"></canvas>
    <div class="hud">
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="disks" id="disks"><span>BONUS</span></div>
    </div>
    <div class="flashfx" id="flashfx" aria-hidden="true"></div>
    <div class="unlock" id="unlock" hidden>
      <div class="rays"></div>
      <svg class="bdisk" viewBox="0 0 24 24" aria-hidden="true"><path class="bd-body" d="M3 3h15l3 3v15H3z"/><rect class="bd-sh" x="7" y="3" width="9" height="6"/><rect class="bd-sl" x="12.5" y="4" width="2" height="4"/><rect class="bd-lb" x="6" y="12.5" width="12" height="8.5" rx=".5"/><path class="bd-ln" d="M8 15h8M8 17.5h6"/></svg>
      <p class="u-kicker"></p>
      <h2 class="u-name"></h2>
    </div>
    <div class="bonus" id="bonus" hidden><div class="screen"><canvas id="bscene" width="320" height="180"></canvas><pre id="term"></pre></div></div>
    <div class="shelf" id="shelf"></div>
  </main>

  <footer class="deck" id="deck" aria-label="Parts"></footer>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script type="module" src="js/main.js"></script>
